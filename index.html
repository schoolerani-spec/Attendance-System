<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Attendance System (Worker Fixed)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --info: #0ea5e9;
            --danger: #ef4444;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius-lg: 12px;
            --radius-md: 8px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        .auth-screen { display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; position: fixed; top: 0; left: 0; z-index: 2000; padding: 20px; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); }
        .auth-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 36px 28px; border-radius: var(--radius-lg); width: 100%; max-width: 400px; text-align: center; box-shadow: var(--shadow-lg); }
        .auth-card h1 { font-size: 24px; font-weight: 700; color: var(--text-main); margin-bottom: 6px; }
        .auth-card p { font-size: 14px; color: var(--text-muted); margin-bottom: 24px; }
        .auth-btn-group { display: flex; flex-direction: column; gap: 12px; }
        
        .btn-portal { width: 100%; padding: 12px 16px; border: none; border-radius: var(--radius-md); font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.2s ease; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-portal-google { background: #ffffff; color: var(--text-main); border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); }
        .btn-portal-google:hover { background: #f8fafc; }
        .btn-portal-admin { background: var(--primary); color: #fff; }
        .btn-portal-admin:hover { background: var(--primary-hover); }

        .dashboard { display: none; width: 100%; max-width: 1400px; margin: 0 auto; height: 100vh; padding: 16px; flex-direction: column; gap: 16px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 12px 20px; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); flex-shrink: 0; }
        .header h2 { font-size: 18px; font-weight: 700; color: var(--text-main); }
        
        .user-box { display: flex; align-items: center; gap: 12px; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; display: none; border: 2px solid var(--primary); }

        .main-container { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 16px; flex: 1; min-height: 0; }
        @media (max-width: 900px) { .main-container { grid-template-columns: 1fr; overflow-y: auto; } }
        
        .card { background: var(--card-bg); border-radius: var(--radius-lg); padding: 16px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); display: flex; flex-direction: column; min-height: 0; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-shrink: 0; }
        .card-header h3 { font-size: 15px; font-weight: 700; color: var(--text-main); }
        
        .video-wrapper { position: relative; width: 100%; flex: 1; min-height: 280px; background: #0f172a; border-radius: var(--radius-md); overflow: hidden; display: flex; justify-content: center; align-items: center; border: 1px solid var(--border-color); }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        .controls-wrapper { margin-top: 12px; flex-shrink: 0; }
        .btn-init-fast { width: 100%; padding: 14px; background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%); color: #fff; font-size: 14px; font-weight: 700; border: none; border-radius: var(--radius-md); cursor: pointer; box-shadow: var(--shadow-sm); transition: all 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-init-fast:hover { opacity: 0.95; }
        
        .controls { display: none; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; }
        button { padding: 10px 14px; border: none; border-radius: var(--radius-md); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: inline-flex; justify-content: center; align-items: center; gap: 6px; }
        button:hover:not(:disabled) { filter: brightness(1.05); }
        
        .btn-start { background: var(--success); color: #fff; }
        .btn-reg { background: var(--info); color: #fff; }
        .btn-scan { background: var(--primary); color: #fff; }
        .btn-stop { background: var(--danger); color: #fff; }
        .btn-secondary { background: #f1f5f9; color: var(--text-main); border: 1px solid var(--border-color); font-size: 12px; padding: 6px 12px; }
        .btn-danger-sm { background: #fee2e2; color: var(--danger); font-size: 12px; padding: 6px 12px; }
        button:disabled { background: #e2e8f0 !important; color: #94a3b8 !important; cursor: not-allowed; }
        
        .status-box { margin-top: 10px; padding: 10px; border-radius: var(--radius-md); font-weight: 600; font-size: 13px; text-align: center; flex-shrink: 0; }
        .status-idle { background: #f1f5f9; color: var(--text-muted); }
        .status-success { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .status-warning { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .status-danger { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }

        .table-container { flex: 1; overflow-y: auto; border: 1px solid var(--border-color); border-radius: var(--radius-md); min-height: 0; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        th, td { text-align: left; padding: 10px 12px; font-size: 13px; }
        th { background: #f8fafc; color: var(--text-muted); font-weight: 700; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 10; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
        td { border-bottom: 1px solid var(--border-color); color: var(--text-main); }
        tbody tr:hover td { background: #f8fafc; }

        .badge { padding: 4px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; display: inline-block; }
        .badge-present { background: #d1fae5; color: #065f46; }
        .badge-unknown { background: #fee2e2; color: #991b1b; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--card-bg); padding: 20px; border-radius: var(--radius-lg); width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; box-shadow: var(--shadow-lg); border: 1px solid var(--border-color); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
        .modal-header h3 { font-size: 16px; font-weight: 700; color: var(--text-main); }
        .btn-close { background: transparent; border: none; font-size: 20px; font-weight: bold; cursor: pointer; color: var(--text-muted); }
        .btn-delete { background: var(--danger); color: #fff; padding: 4px 8px; font-size: 11px; border-radius: 4px; border: none; cursor: pointer; }
        .modal-section { margin-bottom: 16px; }
        .modal-section h4 { font-size: 11px; font-weight: 700; margin-bottom: 8px; color: var(--text-muted); text-transform: uppercase; }
        .danger-zone { border-top: 1px solid var(--border-color); padding-top: 14px; margin-top: 14px; }
    </style>
</head>

    <canvas id="offscreen-canvas" style="display: none;"></canvas>

    <script id="worker-script" type="text/javascript-worker">
        // Inject Worker Global Compatibility Layer to satisfy face-api.js
        self.window = self;
        self.HTMLImageElement = class {};
        self.HTMLCanvasElement = class {};
        self.HTMLVideoElement = class {};
        self.document = {
            createElement: (type) => {
                if (type === 'canvas') {
                    return typeof OffscreenCanvas !== 'undefined' ? new OffscreenCanvas(300, 150) : {};
                }
                return {};
            }
        };

        importScripts('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0/dist/tf.min.js');
        importScripts('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js');

        let MODEL_URL = 'https://vladmandic.github.io/face-api/model';
        let faceDetectorOptions;
        let isReady = false;

        self.onmessage = async (e) => {
            const { type, payload } = e.data;

            if (type === 'INIT') {
                try {
                    await Promise.all([
                        faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                        faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                        faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                    ]);
                    faceDetectorOptions = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.4 });
                    isReady = true;
                    self.postMessage({ type: 'INIT_COMPLETE' });
                } catch (err) {
                    self.postMessage({ type: 'ERROR', error: err.message });
                }
            }

            if (type === 'EXTRACT_DESCRIPTOR') {
                if (!isReady) return;
                try {
                    const { imageData } = payload;
                    const canvas = new OffscreenCanvas(imageData.width, imageData.height);
                    const ctx = canvas.getContext('2d');
                    ctx.putImageData(imageData, 0, 0);

                    const detection = await faceapi.detectSingleFace(canvas, faceDetectorOptions)
                                                   .withFaceLandmarks()
                                                   .withFaceDescriptor();

                    if (!detection) {
                        self.postMessage({ type: 'DESCRIPTOR_RESULT', success: false, reason: 'NO_FACE' });
                    } else {
                        self.postMessage({ 
                            type: 'DESCRIPTOR_RESULT', 
                            success: true, 
                            descriptor: Array.from(detection.descriptor) 
                        });
                    }
                } catch (err) {
                    self.postMessage({ type: 'ERROR', error: err.message });
                }
            }

            if (type === 'MATCH_FACE') {
                if (!isReady) return;
                try {
                    const { imageData, registeredStudents } = payload;
                    const canvas = new OffscreenCanvas(imageData.width, imageData.height);
                    const ctx = canvas.getContext('2d');
                    ctx.putImageData(imageData, 0, 0);

                    const detection = await faceapi.detectSingleFace(canvas, faceDetectorOptions)
                                                   .withFaceLandmarks()
                                                   .withFaceDescriptor();

                    if (!detection) {
                        self.postMessage({ type: 'MATCH_RESULT', success: false, reason: 'NO_FACE' });
                        return;
                    }

                    const currentDescriptor = detection.descriptor;
                    let bestMatch = null;
                    let lowestDistance = 1.0;

                    registeredStudents.forEach(student => {
                        let distance = 0;
                        for (let i = 0; i < 128; i++) {
                            const diff = currentDescriptor[i] - student.descriptor[i];
                            distance += diff * diff;
                        }
                        distance = Math.sqrt(distance);

                        if (distance < lowestDistance) {
                            lowestDistance = distance;
                            bestMatch = student;
                        }
                    });

                    if (lowestDistance <= 0.52) {
                        self.postMessage({ type: 'MATCH_RESULT', success: true, isMatch: true, name: bestMatch.name, distance: lowestDistance });
                    } else {
                        self.postMessage({ type: 'MATCH_RESULT', success: true, isMatch: false, distance: lowestDistance });
                    }
                } catch (err) {
                    self.postMessage({ type: 'ERROR', error: err.message });
                }
            }
        };
    </script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyACT1695I7JVKCh5zOTYKK9tLrW3XCNLEU",
            authDomain: "attendance-app-d3fc2.firebaseapp.com",
            projectId: "attendance-app-d3fc2",
            storageBucket: "attendance-app-d3fc2.firebasestorage.app",
            messagingSenderId: "850381295049",
            appId: "1:850381295049:web:b59a8d08e872de55d72c18"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        const authScreen = document.getElementById('auth-screen');
        const dashboard = document.getElementById('dashboard');
        const manageModal = document.getElementById('manage-modal');
        const modalTitle = document.getElementById('modal-title');
        const manageStudentsTable = document.getElementById('manage-students-table');

        const video = document.getElementById('webcam');
        const statusMessage = document.getElementById('status-message');
        const logTable = document.getElementById('log-table-body');
        const userEmail = document.getElementById('user-email');
        const userPhoto = document.getElementById('user-photo');
        const offscreenCanvas = document.getElementById('offscreen-canvas');
        const ctx = offscreenCanvas.getContext('2d');
        
        const btnFastInit = document.getElementById('btn-fast-init');
        const controlsGrid = document.getElementById('controls-grid');
        const btnStart = document.getElementById('btn-start');
        const btnReg = document.getElementById('btn-reg');
        const btnScan = document.getElementById('btn-scan');
        const btnStop = document.getElementById('btn-stop');
        
        let stream = null;
        let currentUser = null;
        let registeredStudents = [];
        let unsubscribeLogs = null;
        let isProcessing = false;
        let worker = null;
        let workerResolve = null;

        function initWorker() {
            const blob = new Blob([document.getElementById('worker-script').textContent], { type: 'text/javascript' });
            worker = new Worker(URL.createObjectURL(blob));

            worker.onmessage = (e) => {
                const { type, success, descriptor, isMatch, name, reason, error } = e.data;

                if (type === 'INIT_COMPLETE') {
                    btnFastInit.style.display = 'none';
                    controlsGrid.style.display = 'grid';
                    updateStatus("AI Engine initialized in Web Worker.", "status-idle");
                } else if (type === 'DESCRIPTOR_RESULT') {
                    if (workerResolve) workerResolve({ success, descriptor, reason });
                } else if (type === 'MATCH_RESULT') {
                    if (workerResolve) workerResolve({ success, isMatch, name, reason });
                } else if (type === 'ERROR') {
                    updateStatus(`Worker Error: ${error}`, "status-danger");
                    if (workerResolve) workerResolve({ success: false });
                }
            };
        }

        function initializeFastModels() {
            btnFastInit.disabled = true;
            btnFastInit.textContent = "⌛ Spawning Background Worker...";
            initWorker();
            worker.postMessage({ type: 'INIT' });
        }

        function captureImageData() {
            offscreenCanvas.width = video.videoWidth || 320;
            offscreenCanvas.height = video.videoHeight || 240;
            ctx.drawImage(video, 0, 0, offscreenCanvas.width, offscreenCanvas.height);
            return ctx.getImageData(0, 0, offscreenCanvas.width, offscreenCanvas.height);
        }

        async function registerFace() {
            if (!currentUser || isProcessing) return;
            isProcessing = true;
            btnReg.disabled = true;
            updateStatus("Capturing & analyzing face in worker...", "status-idle");

            const imageData = captureImageData();
            
            const result = await new Promise((resolve) => {
                workerResolve = resolve;
                worker.postMessage({ type: 'EXTRACT_DESCRIPTOR', payload: { imageData } });
            });

            if (!result.success) {
                updateStatus("No face detected. Adjust position.", "status-warning");
                isProcessing = false;
                btnReg.disabled = false;
                return;
            }

            const studentName = prompt("Enter Person's Name:");
            if (!studentName || !studentName.trim()) {
                updateStatus("Cancelled.", "status-idle");
                isProcessing = false;
                btnReg.disabled = false;
                return;
            }

            try {
                await db.collection("users").doc(currentUser.uid).collection("students").add({
                    name: studentName.trim(),
                    descriptor: result.descriptor,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                await loadStudentsFromDatabase();
                updateStatus(`Saved "${studentName}"!`, "status-success");
            } catch (err) {
                updateStatus("Database write failed.", "status-danger");
            } finally {
                isProcessing = false;
                btnReg.disabled = false;
            }
        }

        async function scanFace() {
            if (registeredStudents.length === 0) {
                updateStatus("No registered profiles.", "status-warning");
                return;
            }
            if (isProcessing) return;

            isProcessing = true;
            btnScan.disabled = true;
            updateStatus("Worker matching vector...", "status-idle");

            const imageData = captureImageData();

            const result = await new Promise((resolve) => {
                workerResolve = resolve;
                worker.postMessage({ 
                    type: 'MATCH_FACE', 
                    payload: { imageData, registeredStudents } 
                });
            });

            if (!result.success && result.reason === 'NO_FACE') {
                updateStatus("No face detected.", "status-warning");
            } else if (result.isMatch) {
                updateStatus(`Matched: ${result.name}`, "status-success");
                await saveAttendanceLog(result.name, 'Present', 'badge-present');
            } else {
                updateStatus("Unknown Face", "status-danger");
                await saveAttendanceLog('Unknown', 'Rejected', 'badge-unknown');
            }

            isProcessing = false;
            btnScan.disabled = false;
        }

        async function handleGoogleAuth() {
            try {
                const result = await auth.signInWithPopup(googleProvider);
                if (result.user) showDashboard(result.user);
            } catch (error) {
                auth.signInWithRedirect(googleProvider);
            }
        }

        async function handleAdminAuth() {
            const adminPassword = "krm#project";
            const input = prompt("Enter Admin Passcode:");
            if (input === adminPassword) {
                try {
                    const result = await auth.signInAnonymously();
                    if (result.user) showDashboard(result.user);
                } catch (error) {
                    alert("Admin Sign-In Failed");
                }
            } else if (input !== null) {
                alert("Incorrect Passcode!");
            }
        }

        function showDashboard(user) {
            currentUser = user;
            authScreen.style.display = 'none';
            dashboard.style.display = 'flex';
            userEmail.textContent = user.isAnonymous ? "Admin" : (user.displayName || user.email);
            if (user.photoURL && !user.isAnonymous) {
                userPhoto.src = user.photoURL;
                userPhoto.style.display = 'block';
            } else {
                userPhoto.style.display = 'none';
            }
            loadStudentsFromDatabase().catch(err => console.error(err));
            listenToAttendanceLogs();
        }

        function signOut() {
            if (unsubscribeLogs) unsubscribeLogs();
            auth.signOut();
            currentUser = null;
            stopCamera();
            if (worker) {
                worker.terminate();
                worker = null;
            }
            btnFastInit.style.display = 'flex';
            btnFastInit.disabled = false;
            btnFastInit.textContent = "⚡ Initialize AI Engine (Worker Mode)";
            controlsGrid.style.display = 'none';
            updateStatus("Initialize AI Engine to start scanning.", "status-idle");
            dashboard.style.display = 'none';
            authScreen.style.display = 'flex';
        }

        auth.onAuthStateChanged((user) => {
            if (user) {
                showDashboard(user);
            } else {
                dashboard.style.display = 'none';
                authScreen.style.display = 'flex';
            }
        });

        async function loadStudentsFromDatabase() {
            if (!currentUser) return;
            try {
                const snapshot = await db.collection("users").doc(currentUser.uid).collection("students").get();
                registeredStudents = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    registeredStudents.push({ id: doc.id, name: data.name, descriptor: data.descriptor });
                });
            } catch (err) {
                console.error(err);
            }
        }

        function listenToAttendanceLogs() {
            if (!currentUser) return;
            if (unsubscribeLogs) unsubscribeLogs();
            unsubscribeLogs = db.collection("users")
              .doc(currentUser.uid)
              .collection("attendance_logs")
              .orderBy("timestamp", "desc")
              .limit(30)
              .onSnapshot(snapshot => {
                  logTable.innerHTML = "";
                  snapshot.forEach(doc => {
                      const log = doc.data();
                      const fallbackDate = new Date().toLocaleDateString();
                      renderLogEntry(log.name, log.date || fallbackDate, log.time, log.statusText, log.badgeClass);
                  });
              });
        }

        async function openManageModal() {
            manageModal.style.display = 'flex';
            await refreshManageTable();
        }

        function closeManageModal() {
            manageModal.style.display = 'none';
        }

        async function refreshManageTable() {
            await loadStudentsFromDatabase();
            const totalCount = registeredStudents.length;
            modalTitle.textContent = `Manage Data (${totalCount} Profiles)`;
            manageStudentsTable.innerHTML = "";
            if (totalCount === 0) {
                manageStudentsTable.innerHTML = `<tr><td colspan="2" style="text-align: center; color: var(--text-muted); padding: 15px;">No profiles found.</td></tr>`;
                return;
            }
            registeredStudents.forEach(student => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td><strong>${student.name}</strong></td><td><button class="btn-delete" onclick="deleteStudent('${student.id}', '${student.name}')">Delete</button></td>`;
                manageStudentsTable.appendChild(tr);
            });
        }

        async function deleteStudent(docId, name) {
            if (!currentUser) return;
            if (confirm(`Delete profile for "${name}"?`)) {
                try {
                    await db.collection("users").doc(currentUser.uid).collection("students").doc(docId).delete();
                    await refreshManageTable();
                } catch (err) {
                    alert("Error deleting student.");
                }
            }
        }

        async function clearAttendanceLogs() {
            if (!currentUser) return;
            if (confirm("Delete all attendance logs?")) {
                const snapshot = await db.collection("users").doc(currentUser.uid).collection("attendance_logs").get();
                const batch = db.batch();
                snapshot.docs.forEach(doc => batch.delete(doc.ref));
                await batch.commit();
            }
        }

        async function clearAllData() {
            if (!currentUser) return;
            if (confirm("Permanently delete ALL registered profiles and logs?")) {
                const sSnap = await db.collection("users").doc(currentUser.uid).collection("students").get();
                const b1 = db.batch();
                sSnap.docs.forEach(doc => b1.delete(doc.ref));
                await b1.commit();

                const lSnap = await db.collection("users").doc(currentUser.uid).collection("attendance_logs").get();
                const b2 = db.batch();
                lSnap.docs.forEach(doc => b2.delete(doc.ref));
                await b2.commit();

                await refreshManageTable();
            }
        }

        async function saveAttendanceLog(name, statusText, badgeClass) {
            if (!currentUser) return;
            const now = new Date();
            const dateStr = now.toLocaleDateString();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            await db.collection("users").doc(currentUser.uid).collection("attendance_logs").add({
                name,
                date: dateStr,
                time: timeStr,
                statusText,
                badgeClass,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = stream;
                updateStatus("Camera active.", "status-idle");
                btnStart.disabled = true;
                btnScan.disabled = false;
                btnReg.disabled = false;
                btnStop.disabled = false;
            } catch (err) {
                updateStatus("Camera access denied.", "status-danger");
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            btnStart.disabled = false;
            btnScan.disabled = true;
            btnReg.disabled = true;
            btnStop.disabled = true;
        }

        function updateStatus(msg, className) {
            statusMessage.textContent = msg;
            statusMessage.className = `status-box ${className}`;
        }

        function renderLogEntry(name, dateStr, timeStr, statusText, badgeClass) {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><strong>${name}</strong></td>
                <td>${dateStr}</td>
                <td>${timeStr}</td>
                <td><span class="badge ${badgeClass}">${statusText}</span></td>
            `;
            logTable.appendChild(row);
        }
    </script>
</body>
</html>
