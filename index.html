<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Attendance System</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --info: #0ea5e9;
            --danger: #ef4444;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius-lg: 12px;
            --radius-md: 8px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        .global-error-banner { display: none; background: #fee2e2; color: #991b1b; padding: 10px 16px; font-size: 13px; font-weight: 600; border-bottom: 1px solid #fca5a5; flex-shrink: 0; text-align: center; }

        .auth-screen { display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; position: fixed; top: 0; left: 0; z-index: 2000; padding: 20px; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); }
        .auth-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 36px 28px; border-radius: var(--radius-lg); width: 100%; max-width: 400px; text-align: center; box-shadow: var(--shadow-lg); }
        .auth-card h1 { font-size: 24px; font-weight: 700; color: var(--text-main); margin-bottom: 6px; }
        .auth-card p { font-size: 14px; color: var(--text-muted); margin-bottom: 24px; }
        .auth-btn-group { display: flex; flex-direction: column; gap: 12px; }
        
        .btn-portal { width: 100%; padding: 12px 16px; border: none; border-radius: var(--radius-md); font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.2s ease; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-portal-google { background: #ffffff; color: var(--text-main); border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); }
        .btn-portal-google:hover { background: #f8fafc; }
        .btn-portal-admin { background: var(--primary); color: #fff; }
        .btn-portal-admin:hover { background: var(--primary-hover); }

        .dashboard { display: none; width: 100%; max-width: 1400px; margin: 0 auto; height: 100vh; padding: 16px; flex-direction: column; gap: 16px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 12px 20px; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); flex-shrink: 0; }
        .header h2 { font-size: 18px; font-weight: 700; color: var(--text-main); }
        
        .user-box { display: flex; align-items: center; gap: 12px; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; display: none; border: 2px solid var(--primary); }

        .main-container { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 16px; flex: 1; min-height: 0; }
        @media (max-width: 900px) { .main-container { grid-template-columns: 1fr; overflow-y: auto; } }
        
        .card { background: var(--card-bg); border-radius: var(--radius-lg); padding: 16px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); display: flex; flex-direction: column; min-height: 0; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-shrink: 0; }
        .card-header h3 { font-size: 15px; font-weight: 700; color: var(--text-main); }
        
        .video-wrapper { position: relative; width: 100%; flex: 1; min-height: 280px; background: #0f172a; border-radius: var(--radius-md); overflow: hidden; display: flex; justify-content: center; align-items: center; border: 1px solid var(--border-color); }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        .controls-wrapper { margin-top: 12px; flex-shrink: 0; }
        .btn-init-fast { width: 100%; padding: 14px; background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%); color: #fff; font-size: 14px; font-weight: 700; border: none; border-radius: var(--radius-md); cursor: pointer; box-shadow: var(--shadow-sm); transition: all 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-init-fast:hover { opacity: 0.95; }
        
        .controls { display: none; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; }
        button { padding: 10px 14px; border: none; border-radius: var(--radius-md); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: inline-flex; justify-content: center; align-items: center; gap: 6px; }
        button:hover:not(:disabled) { filter: brightness(1.05); }
        
        .btn-start { background: var(--success); color: #fff; }
        .btn-reg { background: var(--info); color: #fff; }
        .btn-scan { background: var(--primary); color: #fff; }
        .btn-stop { background: var(--danger); color: #fff; }
        .btn-secondary { background: #f1f5f9; color: var(--text-main); border: 1px solid var(--border-color); font-size: 12px; padding: 6px 12px; }
        .btn-danger-sm { background: #fee2e2; color: var(--danger); font-size: 12px; padding: 6px 12px; }
        button:disabled { background: #e2e8f0 !important; color: #94a3b8 !important; cursor: not-allowed; }
        
        .status-box { margin-top: 10px; padding: 10px; border-radius: var(--radius-md); font-weight: 600; font-size: 13px; text-align: center; flex-shrink: 0; }
        .status-idle { background: #f1f5f9; color: var(--text-muted); }
        .status-success { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .status-warning { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .status-danger { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }

        .table-container { flex: 1; overflow-y: auto; border: 1px solid var(--border-color); border-radius: var(--radius-md); min-height: 0; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        td { border-bottom: 1px solid var(--border-color); color: var(--text-main); text-align: left; padding: 10px 12px; font-size: 13px; vertical-align: middle; }
        tbody tr:hover td { background: #f8fafc; }

        .sub-header-cell { background: #f8fafc; color: var(--text-muted); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border-color); padding: 8px 12px; }
        .badge { padding: 4px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; display: inline-block; }
        .badge-present { background: #d1fae5; color: #065f46; }
        .badge-unknown { background: #fee2e2; color: #991b1b; }

        .status-cell-wrapper { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .btn-log-delete { background: transparent; border: none; color: #ef4444; font-size: 14px; font-weight: bold; cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: background 0.2s; line-height: 1; }
        .btn-log-delete:hover { background: #fee2e2; color: #dc2626; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--card-bg); padding: 20px; border-radius: var(--radius-lg); width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; box-shadow: var(--shadow-lg); border: 1px solid var(--border-color); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
        .modal-header h3 { font-size: 16px; font-weight: 700; color: var(--text-main); }
        .btn-close { background: transparent; border: none; font-size: 20px; font-weight: bold; cursor: pointer; color: var(--text-muted); }
        .btn-delete { background: var(--danger); color: #fff; padding: 4px 8px; font-size: 11px; border-radius: 4px; border: none; cursor: pointer; }
        .modal-section { margin-bottom: 16px; }
        .modal-section h4 { font-size: 11px; font-weight: 700; margin-bottom: 8px; color: var(--text-muted); text-transform: uppercase; }
        .danger-zone { border-top: 1px solid var(--border-color); padding-top: 14px; margin-top: 14px; }
    </style>
</head>

    <script>
        const globalErrorBanner = document.getElementById('global-error');

        function throwRuntimeError(err, context = "System") {
            console.error(`[${context} Error]:`, err);
            const msg = err?.message || String(err);
            if (globalErrorBanner) {
                globalErrorBanner.textContent = `⚠️ Runtime Alert (${context}): ${msg}`;
                globalErrorBanner.style.display = 'block';
                setTimeout(() => { globalErrorBanner.style.display = 'none'; }, 8000);
            }
            updateStatus(`Error: ${msg}`, "status-danger");
        }

        window.onerror = function (msg, url, lineNo, columnNo, error) {
            throwRuntimeError(error || msg, "Unhandled");
            return false;
        };

        window.addEventListener('unhandledrejection', function (event) {
            throwRuntimeError(event.reason, "Unhandled Promise");
        });

        let idbDb = null;
        let idbInitPromise = null;

        function ensureIDB() {
            if (idbDb) return Promise.resolve(idbDb);
            if (idbInitPromise) return idbInitPromise;

            idbInitPromise = new Promise((resolve, reject) => {
                const idbReq = indexedDB.open('AIAttendanceDB', 1);
                idbReq.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('students')) {
                        db.createObjectStore('students', { keyPath: 'id' });
                    }
                };
                idbReq.onsuccess = (e) => {
                    idbDb = e.target.result;
                    resolve(idbDb);
                };
                idbReq.onerror = (e) => reject(e.target.error);
            });
            return idbInitPromise;
        }

        async function saveStudentToIDB(student) {
            try {
                const db = await ensureIDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction('students', 'readwrite');
                    tx.objectStore('students').put(student);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            } catch (err) {
                throwRuntimeError(err, "IndexedDB Save");
            }
        }

        async function getStudentsFromIDB() {
            try {
                const db = await ensureIDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction('students', 'readonly');
                    const req = tx.objectStore('students').getAll();
                    req.onsuccess = () => resolve(req.result || []);
                    req.onerror = () => reject(req.error);
                });
            } catch (err) {
                throwRuntimeError(err, "IndexedDB Fetch");
                return [];
            }
        }

        const firebaseConfig = {
            apiKey: "AIzaSyACT1695I7JVKCh5zOTYKK9tLrW3XCNLEU",
            authDomain: "attendance-app-d3fc2.firebaseapp.com",
            projectId: "attendance-app-d3fc2",
            storageBucket: "attendance-app-d3fc2.firebasestorage.app",
            messagingSenderId: "850381295049",
            appId: "1:850381295049:web:b59a8d08e872de55d72c18"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const googleProvider = new firebase.auth.GoogleAuthProvider();

        const authScreen = document.getElementById('auth-screen');
        const dashboard = document.getElementById('dashboard');
        const manageModal = document.getElementById('manage-modal');
        const modalTitle = document.getElementById('modal-title');
        const manageStudentsTable = document.getElementById('manage-students-table');

        const video = document.getElementById('webcam');
        const statusMessage = document.getElementById('status-message');
        const logTable = document.getElementById('log-table-body');
        const userEmail = document.getElementById('user-email');
        const userPhoto = document.getElementById('user-photo');
        
        const btnFastInit = document.getElementById('btn-fast-init');
        const controlsGrid = document.getElementById('controls-grid');
        const btnStart = document.getElementById('btn-start');
        const btnReg = document.getElementById('btn-reg');
        const btnScan = document.getElementById('btn-scan');
        const btnStop = document.getElementById('btn-stop');
        
        let stream = null;
        let isStartingCamera = false;
        let isInitializing = false;
        let currentUser = null;
        let registeredStudents = [];
        let unsubscribeLogs = null;
        let isProcessing = false;
        let faceDetectorOptions = null;
        
        const MODEL_URLS = [
            'https://vladmandic.github.io/face-api/model',
            'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model'
        ];

        const sharedCanvas = document.createElement('canvas');
        const sharedCtx = sharedCanvas.getContext('2d', { willReadFrequently: true });

        const lastScanMap = new Map();
        const SCAN_THROTTLE_MS = 0; 

        async function loadModelsWithFallback() {
            for (const url of MODEL_URLS) {
                try {
                    await Promise.all([
                        faceapi.nets.tinyFaceDetector.loadFromUri(url),
                        faceapi.nets.faceLandmark68Net.loadFromUri(url),
                        faceapi.nets.faceRecognitionNet.loadFromUri(url)
                    ]);
                    return true;
                } catch (e) {
                    console.warn(`Failed loading models from ${url}, trying next...`);
                }
            }
            throw new Error("All CDN model endpoints failed.");
        }

        async function initializeFastModels() {
            if (isInitializing) return;
            isInitializing = true;
            btnFastInit.disabled = true;
            btnFastInit.textContent = "⌛ Initializing Hardware Engine...";
            updateStatus("Configuring backend hardware acceleration...", "status-idle");

            try {
                const tf = faceapi.tf;

                if (tf) {
                    if (tf.engine().registryFactory['webgpu']) {
                        await tf.setBackend('webgpu');
                    } else if (tf.engine().registryFactory['wasm']) {
                        await tf.setBackend('wasm');
                    }
                    await tf.ready();
                }

                await loadModelsWithFallback();
                
                faceDetectorOptions = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.4 });

                btnFastInit.textContent = "⚙️ Warming up Neural Pipelines...";
                updateStatus("Warming up GPU execution contexts...", "status-idle");
                
                sharedCanvas.width = 224; 
                sharedCanvas.height = 224;
                sharedCtx.fillRect(0, 0, 224, 224);

                await faceapi.detectSingleFace(sharedCanvas, faceDetectorOptions)
                               .withFaceLandmarks()
                               .withFaceDescriptor();

                btnFastInit.style.display = 'none';
                controlsGrid.style.display = 'grid';
                updateStatus("Hardware Engine active! Start camera to proceed.", "status-idle");
            } catch (err) {
                btnFastInit.disabled = false;
                btnFastInit.textContent = "⚡ Initialize AI Engine";
                throwRuntimeError(err, "Model Init");
            } finally {
                isInitializing = false;
            }
        }

        function checkImageSharpness(videoElement) {
            const width = videoElement.videoWidth || 640;
            const height = videoElement.videoHeight || 480;

            if (sharedCanvas.width !== width || sharedCanvas.height !== height) {
                sharedCanvas.width = width;
                sharedCanvas.height = height;
            }

            sharedCtx.drawImage(videoElement, 0, 0, width, height);
            const imgData = sharedCtx.getImageData(0, 0, width, height);
            const data = imgData.data;

            let sum = 0, count = 0;
            for (let i = 0; i < data.length; i += 16) {
                const gray = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
                sum += gray;
                count++;
            }
            const mean = sum / (count || 1);
            let variance = 0;
            for (let i = 0; i < data.length; i += 16) {
                const gray = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
                variance += Math.pow(gray - mean, 2);
            }
            return { variance: variance / (count || 1), meanBrightness: mean };
        }

        function computeCosineSimilarity(vecA, vecB) {
            let dotProduct = 0.0, normA = 0.0, normB = 0.0;
            for (let i = 0; i < 128; i++) {
                dotProduct += vecA[i] * vecB[i];
                normA += vecA[i] * vecA[i];
                normB += vecB[i] * vecB[i];
            }
            return dotProduct / (Math.sqrt(normA) * Math.sqrt(normB));
        }

        function getEyeAspectRatio(eye) {
            if (!eye || eye.length < 6) return 0;
            const p2_p6 = Math.hypot(eye[1].x - eye[5].x, eye[1].y - eye[5].y);
            const p3_p5 = Math.hypot(eye[2].x - eye[4].x, eye[2].y - eye[4].y);
            const p1_p4 = Math.hypot(eye[0].x - eye[3].x, eye[0].y - eye[3].y);
            return p1_p4 === 0 ? 0 : (p2_p6 + p3_p5) / (2.0 * p1_p4);
        }

        async function verifyLivenessAndPitch(videoEl) {
            let samples = [];
            for (let i = 0; i < 3; i++) {
                const det = await faceapi.detectSingleFace(videoEl, faceDetectorOptions).withFaceLandmarks();
                if (det) samples.push(det);
                await new Promise(r => setTimeout(r, 100));
            }
            if (samples.length < 3) return false;

            const eye1 = samples[0].landmarks?.getLeftEye?.();
            const eye2 = samples[1].landmarks?.getLeftEye?.();
            const eye3 = samples[2].landmarks?.getLeftEye?.();

            if (!eye1 || !eye2 || !eye3) return false;

            const ear1 = getEyeAspectRatio(eye1);
            const ear2 = getEyeAspectRatio(eye2);
            const ear3 = getEyeAspectRatio(eye3);
            const earVariance = Math.abs(ear1 - ear2) + Math.abs(ear2 - ear3);

            const pos0 = samples[0].detection.box;
            const pos2 = samples[2].detection.box;
            const motionDelta = Math.hypot(pos0.x - pos2.x, pos0.y - pos2.y);

            return (earVariance > 0.015 || motionDelta > 2.0);
        }

        async function registerFace() {
            if (!currentUser || isProcessing) return;
            if (!video.srcObject || video.paused) {
                updateStatus("Please start camera first.", "status-warning");
                return;
            }

            isProcessing = true;
            btnReg.disabled = true;
            updateStatus("Checking pose and lighting...", "status-idle");

            try {
                const { variance } = checkImageSharpness(video);
                if (variance < 80) {
                    updateStatus("Image too blurry. Hold device steady.", "status-warning");
                    return;
                }

                const detection = await faceapi.detectSingleFace(video, faceDetectorOptions)
                                               .withFaceLandmarks()
                                               .withFaceDescriptor();

                if (!detection) {
                    updateStatus("Face positioning error. Look straight ahead.", "status-warning");
                    return;
                }

                const studentName = prompt("Enter Person's Name:");
                if (!studentName || !studentName.trim()) {
                    updateStatus("Registration cancelled.", "status-idle");
                    return;
                }

                const float32Vec = new Float32Array(detection.descriptor);
                const descriptorArray = Array.from(float32Vec);
                
                const docRef = await db.collection("users").doc(currentUser.uid).collection("students").add({
                    name: studentName.trim(),
                    descriptor: descriptorArray,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                await saveStudentToIDB({ id: docRef.id, name: studentName.trim(), descriptor: descriptorArray, vectorBuffer: float32Vec });
                await loadStudentsFromDatabase();
                updateStatus(`Registered successfully!`, "status-success");
            } catch (err) {
                throwRuntimeError(err, "Face Registration");
            } finally {
                isProcessing = false;
                btnReg.disabled = false;
            }
        }

        async function scanFace() {
            if (registeredStudents.length === 0) {
                updateStatus("No registered profiles found.", "status-warning");
                return;
            }
            if (!video.srcObject || video.paused) {
                updateStatus("Please start camera first.", "status-warning");
                return;
            }
            if (isProcessing) return;

            isProcessing = true;
            btnScan.disabled = true;
            updateStatus("Analyzing live stream...", "status-idle");

            try {
                const { variance, meanBrightness } = checkImageSharpness(video);
                if (variance < 60) {
                    updateStatus("Image feed blurry. Adjust position.", "status-warning");
                    return;
                }

                let cosThreshold = 0.82; 
                if (meanBrightness < 70) cosThreshold = 0.88;

                const livePass = await verifyLivenessAndPitch(video);
                if (!livePass) {
                    updateStatus("Liveness verification failed. Blink or tilt head.", "status-warning");
                    return;
                }

                const detection = await faceapi.detectSingleFace(video, faceDetectorOptions)
                                               .withFaceLandmarks()
                                               .withFaceDescriptor();

                if (!detection) {
                    updateStatus("No face detected.", "status-warning");
                    return;
                }

                const currentVector = new Float32Array(detection.descriptor);
                let bestMatch = null;
                let highestSimilarity = -1.0;

                registeredStudents.forEach(student => {
                    const sim = computeCosineSimilarity(currentVector, student.vectorBuffer);
                    if (sim > highestSimilarity) {
                        highestSimilarity = sim;
                        bestMatch = student;
                    }
                });

                const confidencePct = Math.min(100, Math.max(0, Math.round(highestSimilarity * 100)));

                if (highestSimilarity >= cosThreshold) {
                    const now = Date.now();
                    const lastScan = lastScanMap.get(bestMatch.id) || 0;

                    if (SCAN_THROTTLE_MS > 0 && (now - lastScan < SCAN_THROTTLE_MS)) {
                        updateStatus(`Already logged: ${bestMatch.name} (Throttled)`, "status-warning");
                        return;
                    }

                    lastScanMap.set(bestMatch.id, now);
                    updateStatus(`Match found: ${bestMatch.name} (${confidencePct}%)`, "status-success");
                    await saveAttendanceLog(bestMatch.name, confidencePct, 'Present', 'badge-present');
                } else {
                    updateStatus("Face profile not recognized.", "status-danger");
                    await saveAttendanceLog('Unknown', confidencePct, 'Rejected', 'badge-unknown');
                }
            } catch (err) {
                throwRuntimeError(err, "Face Scan");
            } finally {
                isProcessing = false;
                btnScan.disabled = false;
            }
        }

        async function handleGoogleAuth() {
            try {
                const result = await auth.signInWithPopup(googleProvider);
                if (result.user) showDashboard(result.user);
            } catch (error) {
                try {
                    await auth.signInWithRedirect(googleProvider);
                } catch (e) {
                    throwRuntimeError(e, "Auth Redirect");
                }
            }
        }

        async function handleAdminAuth() {
            const adminPassword = "krm#project";
            const input = prompt("Enter Admin Passcode:");
            if (input === adminPassword) {
                try {
                    const result = await auth.signInAnonymously();
                    if (result.user) showDashboard(result.user);
                } catch (error) {
                    throwRuntimeError(error, "Admin Login");
                }
            } else if (input !== null) {
                alert("Incorrect Passcode!");
            }
        }

        function showDashboard(user) {
            currentUser = user;
            authScreen.style.display = 'none';
            dashboard.style.display = 'flex';
            userEmail.textContent = user.isAnonymous ? "Admin" : (user.displayName || user.email);
            if (user.photoURL && !user.isAnonymous) {
                userPhoto.src = user.photoURL;
                userPhoto.style.display = 'block';
            } else {
                userPhoto.style.display = 'none';
            }
            loadStudentsFromDatabase().catch(err => throwRuntimeError(err, "DB Load"));
            listenToAttendanceLogs();
        }

        function signOut() {
            if (unsubscribeLogs) {
                unsubscribeLogs();
                unsubscribeLogs = null;
            }
            stopCamera();
            auth.signOut().catch(err => throwRuntimeError(err, "Sign Out"));
            currentUser = null;
            btnFastInit.style.display = 'flex';
            btnFastInit.disabled = false;
            btnFastInit.textContent = "⚡ Initialize AI Engine";
            controlsGrid.style.display = 'none';
            updateStatus("Initialize AI Engine to start scanning.", "status-idle");
            dashboard.style.display = 'none';
            authScreen.style.display = 'flex';
        }

        auth.onAuthStateChanged((user) => {
            if (user) {
                showDashboard(user);
            } else {
                dashboard.style.display = 'none';
                authScreen.style.display = 'flex';
            }
        });

        async function loadStudentsFromDatabase() {
            if (!currentUser) return;
            try {
                const cached = await getStudentsFromIDB();
                if (cached.length > 0) {
                    registeredStudents = cached.map(c => ({
                        id: c.id,
                        name: c.name,
                        descriptor: c.descriptor,
                        vectorBuffer: c.vectorBuffer || new Float32Array(c.descriptor)
                    }));
                }

                const snapshot = await db.collection("users").doc(currentUser.uid).collection("students").get();
                registeredStudents = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const vec = new Float32Array(data.descriptor);
                    registeredStudents.push({ id: doc.id, name: data.name, descriptor: data.descriptor, vectorBuffer: vec });
                    saveStudentToIDB({ id: doc.id, name: data.name, descriptor: data.descriptor, vectorBuffer: vec });
                });
            } catch (err) {
                throwRuntimeError(err, "Fetch Profiles");
            }
        }

        function listenToAttendanceLogs() {
            if (!currentUser) return;
            if (unsubscribeLogs) {
                unsubscribeLogs();
                unsubscribeLogs = null;
            }
            
            unsubscribeLogs = db.collection("users")
              .doc(currentUser.uid)
              .collection("attendance_logs")
              .orderBy("timestamp", "desc")
              .limit(50)
              .onSnapshot(
                  snapshot => {
                      logTable.innerHTML = "";
                      let lastSeenDate = null;

                      snapshot.forEach(doc => {
                          const log = doc.data();
                          const dateStr = log.date || new Date().toLocaleDateString();

                          if (dateStr !== lastSeenDate) {
                              renderDateGroupHeader(dateStr);
                              lastSeenDate = dateStr;
                          }

                          renderLogEntry(doc.id, log.name, log.confidence ?? 0, log.time, log.statusText, log.badgeClass);
                      });
                  },
                  err => throwRuntimeError(err, "Firestore Stream")
              );
        }

        function renderDateGroupHeader(dateStr) {
            const dateRow = document.createElement('tr');
            dateRow.innerHTML = `
                <td colspan="4" style="background-color: #e2e8f0; font-weight: 700; color: #0f172a; font-size: 13px; padding: 10px 12px; border-top: 2px solid var(--border-color); border-bottom: 1px solid var(--border-color);">
                </td>
            `;
            dateRow.querySelector('td').textContent = `📅 ${dateStr}`;
            logTable.appendChild(dateRow);

            const colHeaderRow = document.createElement('tr');
            colHeaderRow.innerHTML = `
                <td class="sub-header-cell">NAME</td>
                <td class="sub-header-cell">CONFIDENCE</td>
                <td class="sub-header-cell">TIME</td>
                <td class="sub-header-cell">STATUS</td>
            `;
            logTable.appendChild(colHeaderRow);
        }

        function renderLogEntry(docId, name, confidence, timeStr, statusText, badgeClass) {
            const row = document.createElement('tr');
            
            const tdName = document.createElement('td');
            const strong = document.createElement('strong');
            strong.textContent = name;
            tdName.appendChild(strong);

            const tdConf = document.createElement('td');
            tdConf.textContent = `${confidence}%`;
            tdConf.style.fontWeight = '600';
            tdConf.style.color = confidence >= 80 ? 'var(--success)' : 'var(--danger)';

            const tdTime = document.createElement('td');
            tdTime.textContent = timeStr;

            const tdStatus = document.createElement('td');
            
            const wrapper = document.createElement('div');
            wrapper.className = 'status-cell-wrapper';

            const span = document.createElement('span');
            span.className = `badge ${badgeClass}`;
            span.textContent = statusText;

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'btn-log-delete';
            deleteBtn.innerHTML = '&#10005;'; 
            deleteBtn.title = 'Delete this log entry';
            deleteBtn.onclick = () => deleteSingleLog(docId);

            wrapper.appendChild(span);
            wrapper.appendChild(deleteBtn);
            tdStatus.appendChild(wrapper);

            row.appendChild(tdName);
            row.appendChild(tdConf);
            row.appendChild(tdTime);
            row.appendChild(tdStatus);
            logTable.appendChild(row);
        }

        async function deleteSingleLog(logId) {
            if (!currentUser) return;
            if (confirm("Delete this log entry?")) {
                try {
                    await db.collection("users").doc(currentUser.uid).collection("attendance_logs").doc(logId).delete();
                } catch (err) {
                    throwRuntimeError(err, "Delete Log");
                }
            }
        }

        async function openManageModal() {
            manageModal.style.display = 'flex';
            await refreshManageTable();
        }

        function closeManageModal() {
            manageModal.style.display = 'none';
        }

        async function refreshManageTable() {
            try {
                await loadStudentsFromDatabase();
                const totalCount = registeredStudents.length;
                modalTitle.textContent = `Manage Data (${totalCount} Profiles)`;
                manageStudentsTable.innerHTML = "";
                
                if (totalCount === 0) {
                    manageStudentsTable.innerHTML = `<tr><td colspan="2" style="text-align: center; color: var(--text-muted); padding: 15px;">No profiles found.</td></tr>`;
                    return;
                }

                registeredStudents.forEach(student => {
                    const tr = document.createElement('tr');
                    const tdName = document.createElement('td');
                    const strong = document.createElement('strong');
                    strong.textContent = student.name;
                    tdName.appendChild(strong);

                    const tdAction = document.createElement('td');
                    const btn = document.createElement('button');
                    btn.className = 'btn-delete';
                    btn.textContent = 'Delete';
                    btn.onclick = () => deleteStudent(student.id, student.name);
                    tdAction.appendChild(btn);

                    tr.appendChild(tdName);
                    tr.appendChild(tdAction);
                    manageStudentsTable.appendChild(tr);
                });
            } catch (err) {
                throwRuntimeError(err, "Modal Refresh");
            }
        }

        async function deleteStudent(docId, name) {
            if (!currentUser) return;
            if (confirm(`Delete profile for "${name}"?`)) {
                try {
                    await db.collection("users").doc(currentUser.uid).collection("students").doc(docId).delete();
                    const idb = await ensureIDB();
                    const tx = idb.transaction('students', 'readwrite');
                    tx.objectStore('students').delete(docId);
                    await refreshManageTable();
                } catch (err) {
                    throwRuntimeError(err, "Delete Student");
                }
            }
        }

        async function clearAttendanceLogs() {
            if (!currentUser) return;
            if (confirm("Delete all attendance logs?")) {
                try {
                    const snapshot = await db.collection("users").doc(currentUser.uid).collection("attendance_logs").get();
                    const batch = db.batch();
                    snapshot.docs.forEach(doc => batch.delete(doc.ref));
                    await batch.commit();
                } catch (err) {
                    throwRuntimeError(err, "Clear Logs");
                }
            }
        }

        async function clearAllData() {
            if (!currentUser) return;
            if (confirm("Permanently delete ALL registered profiles and logs?")) {
                try {
                    const sSnap = await db.collection("users").doc(currentUser.uid).collection("students").get();
                    const b1 = db.batch();
                    sSnap.docs.forEach(doc => b1.delete(doc.ref));
                    await b1.commit();

                    const lSnap = await db.collection("users").doc(currentUser.uid).collection("attendance_logs").get();
                    const b2 = db.batch();
                    lSnap.docs.forEach(doc => b2.delete(doc.ref));
                    await b2.commit();

                    const idb = await ensureIDB();
                    const tx = idb.transaction('students', 'readwrite');
                    tx.objectStore('students').clear();

                    await refreshManageTable();
                } catch (err) {
                    throwRuntimeError(err, "Clear All Data");
                }
            }
        }

        async function saveAttendanceLog(name, confidence, statusText, badgeClass) {
            if (!currentUser) return;
            try {
                const now = new Date();
                const dateStr = now.toLocaleDateString();
                const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

                await db.collection("users").doc(currentUser.uid).collection("attendance_logs").add({
                    name,
                    confidence,
                    date: dateStr,
                    time: timeStr,
                    statusText,
                    badgeClass,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (err) {
                throwRuntimeError(err, "Save Log");
            }
        }

        async function startCamera() {
            if (isStartingCamera) return;
            isStartingCamera = true;

            try {
                const mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                
                if (!isStartingCamera) {
                    mediaStream.getTracks().forEach(track => track.stop());
                    return;
                }

                stream = mediaStream;
                video.srcObject = stream;
                updateStatus("Camera active.", "status-idle");
                btnStart.disabled = true;
                btnScan.disabled = false;
                btnReg.disabled = false;
                btnStop.disabled = false;
            } catch (err) {
                if (err.name === "NotAllowedError") {
                    updateStatus("Camera blocked. Please grant browser permissions.", "status-danger");
                } else if (err.name === "NotFoundError") {
                    updateStatus("No webcam detected on this device.", "status-danger");
                } else if (err.name === "NotReadableError") {
                    updateStatus("Camera in use by another app.", "status-danger");
                } else {
                    throwRuntimeError(err, "Camera Access");
                }
            } finally {
                isStartingCamera = false;
            }
        }

        function stopCamera() {
            isStartingCamera = false;
            if (stream) {
                stream.getTracks().forEach(track => {
                    track.stop();
                    stream.removeTrack(track);
                });
                video.srcObject = null;
                stream = null;
            }
            btnStart.disabled = false;
            btnScan.disabled = true;
            btnReg.disabled = true;
            btnStop.disabled = true;
        }

        function updateStatus(msg, className) {
            statusMessage.textContent = msg;
            statusMessage.className = `status-box ${className}`;
        }
    </script>
</body>
</html>
